
services:
  # NestJS API
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: ai-estimates-api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    networks:
      - app-network

  # React + Nginx
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ai-estimates-web
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - api
    networks:
      - app-network

  # Main PostgreSQL 17
  postgres:
    image: postgres:17
    container_name: ai-estimates-db
    env_file:
      - ./api/.env
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Disposable DB for migration/integration tests
  postgres-migration-test:
    image: postgres:17
    container_name: ai-estimates-migration-test-db
    profiles:
      - test
    environment:
      POSTGRES_DB: ai_estimator_migration_admin
      POSTGRES_USER: ai_estimator_migration_test
      POSTGRES_PASSWORD: ai_estimator_migration_test_password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_migration_test_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_migration_test_data:
