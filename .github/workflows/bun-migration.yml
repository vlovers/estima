name: Bun migration validation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feat/bun-migration-20261015]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NX_DAEMON: "false"
      NX_SKIP_NX_CACHE: "true"
      NX_ISOLATE_PLUGINS: "false"
      NX_TUI: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Migrate lockfile
        run: |
          if [ ! -f bun.lock ]; then
            rm -f package-lock.json
            bun install --lockfile-only
          fi
      - name: Save Bun lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bun-lockfile
          path: bun.lock
          if-no-files-found: error
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify native bcrypt
        run: bun -e "const bcrypt = require('bcrypt'); const hash = bcrypt.hashSync('test', 4); if (!bcrypt.compareSync('test', hash)) process.exit(1)"
      - name: Restore Nx Linux native binary
        timeout-minutes: 3
        run: |
          bun add --optional @nx/nx-linux-x64-gnu@21.3.2
          test -d node_modules/@nx/nx-linux-x64-gnu
          ls -la node_modules/@nx/nx-linux-x64-gnu
      - name: Diagnose Nx native loading
        timeout-minutes: 2
        run: |
          echo "Inspect native Nx binary packages"
          ls -la node_modules/@nx/nx-linux-x64-gnu || true
          echo "Check Nx native import without postinstall"
          timeout 35s node -e "require('./node_modules/nx/src/native'); console.log('Nx native loaded successfully')"
      - name: Verify Nx project graph without postinstall
        timeout-minutes: 2
        run: timeout 95s node ./node_modules/nx/bin/nx.js show projects --verbose
      - name: Lint
        timeout-minutes: 5
        run: bun run lint
      - name: Unit tests
        timeout-minutes: 8
        run: bun run test -- --parallel=1
      - name: Build API
        run: bun run build:api
      - name: Build web
        run: bun run build:web
      - name: Build Docker images
        run: |
          docker build -f api/Dockerfile -t estima-api:bun .
          docker build -f web/Dockerfile -t estima-web:bun .

      - name: Commit migration lockfile
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/bun-migration-20261015'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm -f --ignore-unmatch yarn.lock package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: finalize Bun lockfile migration"
            git push
          fi
