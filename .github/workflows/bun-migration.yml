name: Bun migration validation

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NX_DAEMON: "false"
      NX_SKIP_NX_CACHE: "true"
      NX_ISOLATE_PLUGINS: "false"
      NX_TUI: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Install dependencies
        run: bun ci --ignore-scripts
      - name: Verify native bcrypt
        run: bun -e "const bcrypt = require('bcrypt'); const hash = bcrypt.hashSync('test', 4); if (!bcrypt.compareSync('test', hash)) process.exit(1)"
      - name: Verify Nx project graph without postinstall
        timeout-minutes: 2
        run: timeout 95s node ./node_modules/nx/bin/nx.js show projects --verbose
      - name: Lint
        timeout-minutes: 5
        run: bun run lint
      - name: Unit tests
        timeout-minutes: 8
        run: bun run test -- --parallel=1
      - name: Build API
        run: bun run build:api
      - name: Build web
        run: bun run build:web
      - name: Build Docker images
        run: |
          docker build -f api/Dockerfile -t estima-api:bun .
          docker build -f web/Dockerfile -t estima-web:bun .

