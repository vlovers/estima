name: Bun migration validation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feat/bun-migration-20261015]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NX_DAEMON: "false"
      NX_SKIP_NX_CACHE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Migrate lockfile
        run: |
          rm -f package-lock.json
          bun install --lockfile-only
      - name: Save Bun lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bun-lockfile
          path: bun.lock
          if-no-files-found: error
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test -- --parallel=1
      - name: Build API
        run: bun run build:api
      - name: Build web
        run: bun run build:web
      - name: Build Docker images
        run: |
          docker build -f api/Dockerfile -t estima-api:bun .
          docker build -f web/Dockerfile -t estima-web:bun .
