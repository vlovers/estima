name: Bun migration validation

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      NX_DAEMON: "false"
      NX_SKIP_NX_CACHE: "true"
      NX_ISOLATE_PLUGINS: "false"
      NX_TUI: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Install dependencies
        run: bun ci --ignore-scripts
      - name: Verify lockfile and native modules
        run: node scripts/verify-native-dependencies.cjs
      - name: Verify Compose CORS propagation
        run: node scripts/verify-cors.cjs --compose
      - name: Verify Nx project graph without postinstall
        timeout-minutes: 2
        run: timeout 95s node ./node_modules/nx/bin/nx.js show projects --verbose
      - name: Lint
        timeout-minutes: 5
        run: bun run lint
      - name: Unit tests
        timeout-minutes: 8
        run: bun run test -- --parallel=1
      - name: Build API
        run: bun run build:api
      - name: Build web
        run: bun run build:web
      - name: Build Docker images
        run: |
          docker build -f api/Dockerfile -t estima-api:bun .
          docker build -f web/Dockerfile -t estima-web:bun .

