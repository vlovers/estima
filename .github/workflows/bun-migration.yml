name: Bun migration validation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feat/bun-migration-20261015]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NX_DAEMON: "false"
      NX_SKIP_NX_CACHE: "true"
      NX_ISOLATE_PLUGINS: "false"
      NX_TUI: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Migrate lockfile
        run: |
          if [ ! -f bun.lock ]; then
            rm -f package-lock.json
            bun install --lockfile-only
          fi
      - name: Save Bun lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bun-lockfile
          path: bun.lock
          if-no-files-found: error
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify native bcrypt
        run: bun -e "const bcrypt = require('bcrypt'); const hash = bcrypt.hashSync('test', 4); if (!bcrypt.compareSync('test', hash)) process.exit(1)"
      - name: Diagnose Nx plugins independently
        timeout-minutes: 8
        run: |
          cp nx.json nx.json.original
          for plugin in none webpack react-router vite playwright; do
            node - "$plugin" <<'NODE'
          const fs = require('fs');
          const plugin = process.argv[2];
          const nx = JSON.parse(fs.readFileSync('nx.json.original', 'utf8'));
          nx.plugins = plugin === 'none' ? [] : nx.plugins.filter(p => p.plugin.includes(plugin === 'react-router' ? '/router-plugin' : '/' + plugin + '/plugin'));
          fs.writeFileSync('nx.json', JSON.stringify(nx, null, 2) + '\n');
          NODE
            echo "===== Nx plugin: $plugin ====="
            if timeout 55s node ./node_modules/nx/bin/nx.js show projects --verbose; then
              echo "PASS: $plugin"
            else
              echo "FAIL_OR_TIMEOUT: $plugin"
            fi
          done
          mv nx.json.original nx.json
      - name: Diagnose complete Nx graph
        timeout-minutes: 3
        run: timeout 145s node ./node_modules/nx/bin/nx.js show projects --verbose
      - name: Lint
        timeout-minutes: 5
        run: bun run lint
      - name: Unit tests
        timeout-minutes: 8
        run: bun run test -- --parallel=1
      - name: Build API
        run: bun run build:api
      - name: Build web
        run: bun run build:web
      - name: Build Docker images
        run: |
          docker build -f api/Dockerfile -t estima-api:bun .
          docker build -f web/Dockerfile -t estima-web:bun .

      - name: Commit migration lockfile
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/bun-migration-20261015'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm -f --ignore-unmatch yarn.lock package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: finalize Bun lockfile migration"
            git push
          fi
