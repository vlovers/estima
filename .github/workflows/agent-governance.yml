name: Agent governance contract
# PR checks run for every change, including code-only PRs; path filters can leave
# required checks pending forever and allow governance checks to be skipped.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
# Keep required PR checks active on every change, while cancelling only
# superseded runs for the same PR. Preserve develop and manual checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test test/check-governance.test.mjs
      - run: node scripts/check-governance.mjs
